name: Release

on:
  push:
    tags: ['v*', 'release-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a tagged main commit
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: ./.github/actions/dependency-cache
      - name: Select immutable tag or manual draft
        id: mode
        run: node ci/release-mode.mjs plan
      - run: npm install --global npm@10.9.2 --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix ci/host --ignore-scripts --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000
      - name: Build version-matched precompiled assets
        run: |
          npm run release:build -- --out dist --tag '${{ steps.mode.outputs.tag }}'
          npm run release:verify -- --out dist
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/release-mode.mjs publish
