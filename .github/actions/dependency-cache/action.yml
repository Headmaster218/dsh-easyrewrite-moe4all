name: Repository-local dependency cache
description: Restore npm download cache; only successful trusted main jobs save it.
inputs:
  node-version:
    description: Optional Node version override; defaults to the repository .node-version.
    required: false
outputs:
  key:
    description: Exact dependency cache key.
    value: ${{ steps.plan.outputs.key }}
  cache-hit:
    description: Whether an exact cache was restored.
    value: ${{ steps.write.outputs.cache-hit || steps.read.outputs.cache-hit || 'false' }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: .node-version
        package-manager-cache: false
    - id: plan
      shell: bash
      run: node ci/dependency-cache.mjs
    - id: write
      if: steps.plan.outputs.save == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      continue-on-error: true
      with:
        path: ${{ steps.plan.outputs.path }}
        key: ${{ steps.plan.outputs.key }}
        restore-keys: ${{ steps.plan.outputs.restoreKey }}
    - id: read
      if: steps.plan.outputs.save != 'true'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      continue-on-error: true
      with:
        path: ${{ steps.plan.outputs.path }}
        key: ${{ steps.plan.outputs.key }}
        restore-keys: ${{ steps.plan.outputs.restoreKey }}
    - name: Cache summary
      shell: bash
      env:
        CACHE_KEY: ${{ steps.plan.outputs.key }}
        CACHE_HIT: ${{ steps.write.outputs.cache-hit || steps.read.outputs.cache-hit || 'false' }}
        CACHE_SAVE: ${{ steps.plan.outputs.save }}
      run: |
        echo "Dependency cache: hit=$CACHE_HIT save=$CACHE_SAVE key=$CACHE_KEY"
        echo "Dependency cache: hit=$CACHE_HIT save=$CACHE_SAVE key=$CACHE_KEY" >> "$GITHUB_STEP_SUMMARY"
