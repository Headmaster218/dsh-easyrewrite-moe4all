name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '24.21.0'
          - os: windows-2025
            node: '24.21.0'
    runs-on: ${{ matrix.os }}
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dependency-cache
        id: dependencies
        with:
          node-version: ${{ matrix.node }}
      - name: Verify repository-local CI policies
        run: node --test ci/dependency-cache.test.mjs ci/release-mode.test.mjs
      - name: Use pinned npm
        run: npm install --global npm@10.9.2 --ignore-scripts --no-audit --no-fund
      - name: Install frozen host fixture without lifecycle scripts
        run: npm ci --prefix ci/host --ignore-scripts --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000
      - name: Validate committed runtime and release contract
        run: |
          npm run ci:check
          npm run ci:contract
      - name: Run offline plugin tests
        env:
          DSH_HOME: ${{ runner.temp }}/moe4all-ci-home
          DSH_AGENTS_HOME: ${{ runner.temp }}/moe4all-ci-agents
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: npm run ci:test
      - name: Ensure checks did not rewrite committed runtime
        run: git diff --exit-code -- lib client
      - name: Pack and verify the exact release payload
        run: |
          TAG="release-$(node -p 'require("./package.json").version')"
          npm run release:build -- --out dist --tag "$TAG"
          npm run release:verify -- --out dist
          npm run ci:contract -- --out dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: plugin-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            dist/*.tgz
            dist/SHA256SUMS.txt
            dist/plugin-release.json
          if-no-files-found: error
          retention-days: 7
